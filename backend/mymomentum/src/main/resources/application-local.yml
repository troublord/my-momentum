# 日常使用配置
# 此檔案用於腳本啟動（-Dspring.profiles.active=local），日誌簡潔
spring:
  datasource:
    # 日常使用：連接本地 Docker 映射的資料庫
    url: jdbc:postgresql://localhost:15432/mymomentumdb
    username: mymomentum
    password: secret123
    driver-class-name: org.postgresql.Driver
  jpa:
    # 日常使用：關閉 SQL 日誌以提高效能
    show-sql: false
    properties:
      hibernate:
        # format_sql: false  # 關閉 SQL 格式化
        jdbc:
          time_zone: UTC

