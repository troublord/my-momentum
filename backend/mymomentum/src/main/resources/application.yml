server:
  port: 8080
spring:
  application:
    name: mymomentum
  datasource:
    url: jdbc:postgresql://postgres:5432/mymomentumdb
    username: ${DB_USERNAME:mymomentum}
    password: ${DB_PASSWORD:chJdp824nmhtC2X4vZ6p0Q==}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate # 改为 validate，让 Flyway 管理 schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # format_sql: true  # 生產環境關閉以提高效能
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Cache Configuration
  cache:
    type: simple
    cache-names:
      - activityDistribution
      - activityTrend
      - activityKPIs

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    baseline-version: 1
    baseline-description: "Initial baseline"
# Application Configuration
app:
  google:
    oauth:
      clientId: ${GOOGLE_CLIENT_ID}
  security:
    jwt:
      secret: ${JWT_SECRET:6056655acbab320d988106f2bfdb19b3332835f21332890ba9a942a25aff91eb}
      expirationMinutes: 240
  cors:
    allowedOrigins:
      - ${FRONTEND_URL:http://3.105.126.71}

logging:
  level:
    org.hibernate.SQL: WARN
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE  # 生產環境關閉
    com.ramble.mymomentum: INFO

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true

