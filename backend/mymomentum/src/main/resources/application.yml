server:
  port: 8080
spring:
  application:
    name: mymomentum
  datasource:
    # 開發環境：使用 localhost 連接本地 Docker 映射的資料庫
    url: jdbc:postgresql://localhost:15432/mymomentumdb
    username: ${DB_USERNAME:mymomentum}
    password: ${DB_PASSWORD:secret123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate # 改为 validate，让 Flyway 管理 schema
    # 調試模式：啟用 SQL 日誌
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true  # 調試模式啟用 SQL 格式化
        jdbc:
          time_zone: UTC
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # Cache Configuration
  cache:
    type: simple
    cache-names:
      - activityDistribution
      - activityTrend
      - activityKPIs

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history
    baseline-version: 1
    baseline-description: "Initial baseline"
# Application Configuration
app:
  google:
    oauth:
      clientId: ${GOOGLE_CLIENT_ID:861849830529-44mlejpcr9jjhh19qbvib8vjfbo42gea.apps.googleusercontent.com}
  security:
    jwt:
      secret: ${JWT_SECRET:6056655acbab320d988106f2bfdb19b3332835f21332890ba9a942a25aff91eb}
      expirationMinutes: 240
  cors:
    allowedOrigins:
      - ${FRONTEND_URL:http://localhost:3000}

# 調試模式：詳細日誌
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.ramble.mymomentum: DEBUG

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
    info:
      enabled: true
  info:
    env:
      enabled: true

# 調試模式：啟用 Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: MyMomentum API
    description: Super momentum management API
    version: 1.0.0
    contact:
      name: Ramble Team
