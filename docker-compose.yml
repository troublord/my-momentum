version: '3.8'

services:
  # Nginx 反向代理服務
  nginx:
    image: nginx:alpine
    container_name: mymomentum-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - mymomentum-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端 React 應用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mymomentum-frontend
    restart: unless-stopped
    networks:
      - mymomentum-network

  # 後端 Spring Boot 應用
  backend:
    build:
      context: ./backend/mymomentum
      dockerfile: Dockerfile
    container_name: mymomentum-backend
    restart: unless-stopped
    env_file:
      - env.prod
    volumes:
      - ./backend/logs:/app/logs
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    networks:
      - mymomentum-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mymomentum-network:
    external: true
    name: mymomentum-network

