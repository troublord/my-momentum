name: CD - Deploy to Production

on:
  push:
    branches: [ production ]
  workflow_dispatch:  # 允許手動觸發

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            
            echo "========================================="
            echo "🚀 Starting deployment to Production"
            echo "========================================="
            echo ""
            
            # 進入專案目錄
            cd /home/ubuntu/my-momentum
            echo "📂 Current directory: $(pwd)"
            
            # 顯示當前版本
            echo "📌 Current commit: $(git rev-parse --short HEAD)"
            
            # 拉取最新程式碼
            echo ""
            echo "📥 Pulling latest code from production branch..."
            git fetch origin production
            git reset --hard origin/production
            
            # 顯示新版本
            echo "📌 New commit: $(git rev-parse --short HEAD)"
            echo "📝 Latest commit message: $(git log -1 --pretty=%B)"
            
            # 停止現有服務
            echo ""
            echo "⏸️  Stopping existing services..."
            docker-compose down || true
            
            # 清理舊的容器和 volumes（可選）
            echo "🧹 Cleaning up old containers..."
            docker container prune -f || true
            
            # 建置並啟動新服務
            echo ""
            echo "🔨 Building and starting services..."
            echo "⏰ This may take 8-10 minutes..."
            docker-compose up -d --build
            
            # 等待服務啟動
            echo ""
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # 顯示容器狀態
            echo ""
            echo "📊 Container status:"
            docker-compose ps
            
            # 健康檢查 - Backend
            echo ""
            echo "🏥 Health check - Backend API..."
            MAX_RETRIES=10
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost/api/actuator/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "⏳ Waiting for backend... (Attempt $RETRY_COUNT/$MAX_RETRIES)"
                sleep 5
              fi
            done
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Backend health check failed after $MAX_RETRIES attempts"
              echo "📋 Backend logs:"
              docker-compose logs --tail=50 backend
              exit 1
            fi
            
            # 健康檢查 - Frontend
            echo ""
            echo "🏥 Health check - Frontend..."
            if curl -f http://localhost > /dev/null 2>&1; then
              echo "✅ Frontend is healthy"
            else
              echo "⚠️  Frontend health check failed, but continuing..."
            fi
            
            # 清理舊的 Docker images
            echo ""
            echo "🧹 Cleaning up old Docker images..."
            docker image prune -f || true
            
            # 顯示磁碟使用情況
            echo ""
            echo "💾 Disk usage:"
            df -h / | tail -1
            
            echo ""
            echo "========================================="
            echo "✅ Deployment completed successfully!"
            echo "========================================="
            echo ""
            echo "🌐 Website: https://my-momentum.app"
            echo "📊 Deployed commit: $(git rev-parse --short HEAD)"
            echo "⏰ Deployed at: $(date)"
            echo ""
          EOF
      
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment from GitHub Actions runner..."
          sleep 5
          
          # 檢查網站是否可訪問
          if curl -f https://my-momentum.app > /dev/null 2>&1; then
            echo "✅ Website https://my-momentum.app is accessible"
          else
            echo "⚠️  Website may not be accessible yet (could be DNS/SSL caching)"
          fi
          
          # 檢查 API 健康狀態
          if curl -f https://my-momentum.app/api/actuator/health > /dev/null 2>&1; then
            echo "✅ API health check passed"
          else
            echo "⚠️  API health check from external failed (could be normal)"
          fi
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "========================================="
            echo "🎉 Deployment to Production Successful!"
            echo "========================================="
            echo ""
            echo "✅ All checks passed"
            echo "🌐 Website: https://my-momentum.app"
            echo "⏰ Total deployment time: Approximately 12 minutes"
            echo ""
            echo "📊 Next steps:"
            echo "  1. Verify website functionality"
            echo "  2. Check application logs if needed"
            echo "  3. Monitor for any issues"
            echo ""
          else
            echo "========================================="
            echo "❌ Deployment Failed!"
            echo "========================================="
            echo ""
            echo "⚠️  Please check the logs above for error details"
            echo "🔧 Troubleshooting:"
            echo "  1. SSH to EC2: ssh ubuntu@my-momentum.app"
            echo "  2. Check logs: docker-compose logs -f"
            echo "  3. Check container status: docker-compose ps"
            echo "  4. Manual rollback if needed: git reset --hard <previous-commit>"
            echo ""
          fi

